<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <radialGradient id="bg" cx="78%" cy="50%" r="80%">
      <stop offset="0" stop-color="#15241d"/>
      <stop offset="0.5" stop-color="#0e1419"/>
      <stop offset="1" stop-color="#0a0d11"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6f0c0"/>
      <stop offset="1" stop-color="#5cc98a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- large faint star, right -->
  <g fill="none" stroke="#7ee0a1" stroke-opacity="0.10" stroke-width="3" stroke-linejoin="round">
    <rect x="620" y="60" width="380" height="380" rx="14"/>
    <rect x="620" y="60" width="380" height="380" rx="14" transform="rotate(45 810 250)"/>
  </g>
  <g fill="none" stroke="#7ee0a1" stroke-opacity="0.05" stroke-width="2" stroke-linejoin="round">
    <rect x="555" y="-5" width="510" height="510" rx="18"/>
    <rect x="555" y="-5" width="510" height="510" rx="18" transform="rotate(45 810 250)"/>
  </g>
  <!-- waveform inside -->
  <g fill="url(#acc)">
    <rect x="701" y="232" width="14" height="36" rx="7" opacity="0.5"/>
    <rect x="729" y="207" width="14" height="86" rx="7" opacity="0.75"/>
    <rect x="757" y="178" width="14" height="144" rx="7"/>
    <rect x="785" y="200" width="14" height="100" rx="7"/>
    <rect x="813" y="160" width="14" height="180" rx="7"/>
    <rect x="841" y="196" width="14" height="108" rx="7"/>
    <rect x="869" y="215" width="14" height="70" rx="7" opacity="0.75"/>
    <rect x="897" y="234" width="14" height="32" rx="7" opacity="0.5"/>
  </g>
  <!-- text -->
  <g font-family="Adwaita Sans">
    <text x="84" y="208" font-size="20" font-weight="600" letter-spacing="4" fill="#7ee0a1">LISTEN · FIND · FOLLOW</text>
    <text x="80" y="282" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#e6edf3">Quran Whisperer</text>
    <text x="84" y="330" font-size="24" font-weight="400" fill="#94a0ad">Know the surah and ayah you're hearing,</text>
    <text x="84" y="362" font-size="24" font-weight="400" fill="#94a0ad">with a translation to follow along.</text>
  </g>
</svg>
